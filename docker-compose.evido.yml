services:
  supertonic-tts:
    build:
      context: .
      dockerfile: docker/evido/Dockerfile
    image: evido-supertonic-tts:1.3.1
    container_name: supertonic-tts
    restart: unless-stopped
    user: "${SUPERTONIC_UID:-1000}:${SUPERTONIC_GID:-1000}"
    environment:
      HF_HOME: /models/huggingface
      SUPERTONIC_CACHE_DIR: /models/supertonic3
      XDG_CACHE_HOME: /models/.cache
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./models:/models
      - ./voices/custom:/voices/custom:ro
    expose:
      - "7788"
    networks:
      evido-live-translate:
        aliases:
          - supertonic-tts
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/v1/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

networks:
  evido-live-translate:
    external: true
